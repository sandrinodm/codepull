name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build package
        run: pnpm build

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Verify lifecycle operations left the repository clean
        shell: bash
        run: |
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            echo "Build, test, or package lifecycle operations modified the repository:"
            printf '%s\n' "$status"
            exit 1
          fi

  package-smoke:
    name: Test and package smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "24"
            run_tests: false
          - os: ubuntu-latest
            node: "26"
            run_tests: true
          - os: macos-latest
            node: "24"
            run_tests: true
          - os: windows-latest
            node: "24"
            run_tests: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        if: matrix.run_tests
        run: pnpm test

      - name: Build package
        run: pnpm build

      - name: Pack and execute installed CLI
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/package-artifact"
          mkdir -p "$package_dir"
          archive="$(npm pack --pack-destination "$package_dir" --json | node -e 'let value=""; process.stdin.on("data", chunk => value += chunk).on("end", () => process.stdout.write(JSON.parse(value)[0].filename))')"
          npm install --global "$package_dir/$archive"
          codepull version
          codepull --help

      - name: Verify lifecycle operations left the repository clean
        shell: bash
        run: |
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            echo "Build, test, or package lifecycle operations modified the repository:"
            printf '%s\n' "$status"
            exit 1
          fi
